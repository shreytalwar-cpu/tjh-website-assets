name: Gold rate sync

# Every 15 minutes from 10:00 to 20:45 IST (04:30–15:15 UTC), plus manual runs.
on:
  schedule:
    - cron: "30,45 4 * * *"
    - cron: "*/15 5-14 * * *"
    - cron: "0,15 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-rate
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            data
            scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read today's rate from Bhav
        env:
          BHAV_SUPABASE_URL: ${{ secrets.BHAV_SUPABASE_URL }}
          BHAV_PUBLISHABLE_KEY: ${{ secrets.BHAV_PUBLISHABLE_KEY }}
        run: node scripts/bhav-sync.mjs
      - name: Commit if the rate changed
        run: |
          if git diff --quiet -- data/gold-rates.json; then exit 0; fi
          git config user.name "tjh-gold-rate-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gold-rates.json
          git commit -m "Gold rate $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
